[package]
name = "wm8960"
authors = ["spinfast <spinfast@tutanota.com>"]
version = "0.2.0"
edition = "2024"
description = """
Embedded-hal based driver for the Wolfson WM8960 Audio Codec.
"""
readme = "README.md"
repository = "https://github.com/imxrt-rs/wm8960-rs"
keywords = ["wolfson", "wm8960", "embedded", "audio-codec"]
categories = ["embedded", "no-std"]
license = "MIT OR Apache-2.0"

[features]
# Regenerate the register map from wm8960.yaml at build time (see build.rs)
codegen = ["dep:chiptool", "dep:serde_yaml"]

[build-dependencies]
chiptool = { git = "https://github.com/embassy-rs/chiptool", rev = "f93815b3481d839471cd671407dbb1884ae29c88", optional = true }
serde_yaml = { version = "0.8", optional = true }
